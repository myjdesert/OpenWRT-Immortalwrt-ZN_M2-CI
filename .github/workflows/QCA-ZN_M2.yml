# =========================================================
# 🎯 兆能 ZN-M2 编译专用触发器
# =========================================================
name: QCA-ZN_M2

on:
  # 自动编译：当 Auto-Clean 运行完成后自动触发
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  # 手动触发编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，仅限一个。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

# 赋予 Actions 写入 Release 的最高权限
permissions: write-all

jobs:
  config:
    name: ZN_M2-Compile
    # 显式调用你的公用核心编译控制中心
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      # 1. 对应 Config 目录下的配置文件名（ZN_M2-WIFI-NO.txt）
      WRT_TARGET: ZN_M2-WIFI-NO
      
      # 2. 强行锁定 ImmortalWrt 官方最新对高通极其友好的 24.10 主线
      WRT_REPO: https://github.com/immortalwrt/immortalwrt.git
      WRT_BRANCH: openwrt-24.10
      
      # 3. 基础外观及网络默认属性微调
      WRT_THEME: argon
      WRT_NAME: ZN-M2
      WRT_WIFI: ZN-M2_WiFi
      WRT_IP: 192.168.1.1
      WRT_PW: none
      
      # 4. 传递外部脚本识别标记
      WRT_SOURCE: immortalwrt/immortalwrt
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST }}
